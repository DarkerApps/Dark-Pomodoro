name: Build Offline Signed APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Accept Android SDK Licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Compile Lovable App into Offline Web Bundle
        run: |
          mkdir -p web-src offline-app/app/src/main/assets
          ZIP_FILE=$(ls -t *.zip 2>/dev/null | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            unzip -q "$ZIP_FILE" -d web-src
          else
            cp -r ./* web-src/ 2>/dev/null || true
          fi

          PKG_PATH=$(find web-src -maxdepth 3 -name "package.json" | head -n 1)
          if [ -z "$PKG_PATH" ]; then
            echo "ERROR: package.json not found inside uploaded ZIP!"
            exit 1
          fi

          APP_DIR=$(dirname "$PKG_PATH")
          echo "Building app from: $APP_DIR"
          cd "$APP_DIR"
          npm install --legacy-peer-deps
          npm run build

          cat << 'EOF' > build-offline-assets.mjs
          import fs from "fs";
          import path from "path";
          import { pathToFileURL } from "url";

          const workspace = process.env.GITHUB_WORKSPACE;
          const assetsDir = path.join(workspace, "offline-app/app/src/main/assets");
          fs.mkdirSync(assetsDir, { recursive: true });

          const candidates = [".output/public", "dist/client", "dist", "build"];
          const staticDir = candidates.find((dir) => fs.existsSync(dir) && fs.statSync(dir).isDirectory());

          if (staticDir) {
            console.log("Copying static assets from:", staticDir);
            fs.cpSync(staticDir, assetsDir, { recursive: true });
          }

          const indexOut = path.join(assetsDir, "index.html");
          if (fs.existsSync(indexOut) && fs.statSync(indexOut).size > 100) {
            console.log("Found existing static index.html:", fs.statSync(indexOut).size, "bytes");
            process.exit(0);
          }

          const mockEnv = {
            ASSETS: {
              fetch: async (reqOrUrl) => {
                const rawUrl = typeof reqOrUrl === "string" ? reqOrUrl : reqOrUrl.url;
                const u = new URL(rawUrl, "http://localhost/");
                const rel = decodeURIComponent(u.pathname).replace(/^\/+/, "");
                const candidate = path.join(assetsDir, rel);
                if (rel && fs.existsSync(candidate) && fs.statSync(candidate).isFile()) {
                  return new Response(fs.readFileSync(candidate));
                }
                return new Response("Not Found", { status: 404 });
              },
            },
          };

          const mockCtx = {
            waitUntil: () => {},
            passThroughOnException: () => {},
          };

          let html = "";
          let usedFallback = false;
          const nitroEntry = path.resolve(".output/server/index.mjs");
          console.log("Nitro entry exists:", fs.existsSync(nitroEntry), nitroEntry);
          if (fs.existsSync(nitroEntry)) {
            try {
              process.env.NODE_ENV = "production";
              const mod = await import(pathToFileURL(nitroEntry).href);
              console.log("Nitro module exports:", Object.keys(mod || {}));
              const fetchFn = mod?.default?.fetch || mod?.fetch || mod?.handler?.fetch;
              if (typeof fetchFn === "function") {
                const res = await fetchFn(new Request("http://localhost/"), mockEnv, mockCtx);
                const text = await res.text();
                console.log("Nitro status:", res.status, "| contains <html:", text.includes("<html"), "| length:", text.length);
                console.log("Nitro body preview:", text.slice(0, 200).replace(/\s+/g, " "));
                if (text && text.includes("<html")) {
                  html = text;
                  console.log("Rendered index.html via Nitro Cloudflare handler:", html.length, "bytes");
                }
              } else {
                console.log("Nitro handler FAILED: no fetch function found in module exports");
              }
            } catch (err) {
              console.log("Nitro handler FAILED:", err && err.stack ? err.stack : err);
            }
          }

          if (!html) {
            usedFallback = true;
            console.log("WARNING: Nitro render failed. Using fallback index.html (may show a BLACK SCREEN).");

            function walkFiles(dir, base = dir, list = []) {
              if (!fs.existsSync(dir)) return list;
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const full = path.join(dir, entry.name);
                if (entry.isDirectory()) walkFiles(full, base, list);
                else list.push("/" + path.relative(base, full).replace(/\\/g, "/"));
              }
              return list;
            }

            const allFiles = walkFiles(assetsDir);
            const cssFiles = allFiles.filter((f) => f.endsWith(".css"));
            const jsFiles = allFiles.filter((f) => f.endsWith(".js") && !f.includes("sw") && !f.includes("workbox"));

            let entryScripts = [];
            for (const mp of [".output/public/.vite/manifest.json", "dist/.vite/manifest.json", "dist/client/.vite/manifest.json"]) {
              if (fs.existsSync(mp)) {
                try {
                  const manifest = JSON.parse(fs.readFileSync(mp, "utf8"));
                  for (const val of Object.values(manifest)) {
                    if (val && val.isEntry && val.file) {
                      entryScripts.push("/" + val.file.replace(/^\/+/, ""));
                    }
                  }
                } catch (_) {}
              }
            }

            if (entryScripts.length === 0) {
              const named = jsFiles.filter((f) => /\/(main|client|entry|index|app)-[^/]+\.js$/i.test(f));
              entryScripts = named.length > 0 ? named : jsFiles;
            }

            if (entryScripts.length === 0) {
              console.error("ERROR: No compiled JS bundles found!");
              process.exit(1);
            }

            const cssTags = cssFiles.map((href) => `    <link rel="stylesheet" crossorigin href="${href}">`).join("\n");
            const jsTags = entryScripts.map((src) => `    <script type="module" crossorigin src="${src}"></script>`).join("\n");

            html = `<!DOCTYPE html>
          <html lang="en" class="dark">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
              <meta name="theme-color" content="#09090B" />
              <title>Dark Pomodoro</title>
          ${cssTags}
            </head>
            <body style="margin:0;background:#09090B;color:#FAFAFA;">
              <div id="root"></div>
          ${jsTags}
            </body>
          </html>
          `;
            console.log("Generated fallback index.html with entries:", entryScripts);
          }

          fs.writeFileSync(indexOut, html, "utf8");
          console.log("RESULT:", usedFallback ? "FALLBACK index.html (likely black screen)" : "REAL rendered index.html");
          console.log("HTML preview:", html.slice(0, 300).replace(/\s+/g, " "));
          process.exit(0);
          EOF

          node build-offline-assets.mjs
          ls -la "$GITHUB_WORKSPACE/offline-app/app/src/main/assets/"

      - name: Generate Private Signing Keystore
        run: |
          keytool -genkeypair -v \
            -keystore android.keystore \
            -alias android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android123 \
            -keypass android123 \
            -dname "CN=Dark Pomodoro, OU=App, O=Priyam Rai, L=Lucknow, S=UP, C=IN"

      - name: Create Offline Android Project
        run: |
          mkdir -p offline-app/app/src/main/java/com/captanprice/midnightfocus
          mkdir -p offline-app/app/src/main/res/values
          mkdir -p offline-app/app/src/main/res/mipmap-xxxhdpi

          node -e '
          const fs = require("fs");
          const path = require("path");
          const zlib = require("zlib");

          const outIcon = "offline-app/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png";

          function findPngFiles(dir, list = []) {
            if (!fs.existsSync(dir)) return list;
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (entry.name === "node_modules") continue;
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) findPngFiles(full, list);
              else if (entry.name.toLowerCase().endsWith(".png")) list.push(full);
            }
            return list;
          }

          const allPngs = [
            ...findPngFiles("offline-app/app/src/main/assets"),
            ...findPngFiles("web-src")
          ];
          const priority = ["512", "maskable", "192", "icon", "logo"];
          let chosen = null;
          for (const key of priority) {
            chosen = allPngs.find(p => path.basename(p).toLowerCase().includes(key));
            if (chosen) break;
          }
          if (!chosen && allPngs.length > 0) chosen = allPngs[0];

          let copied = false;
          if (chosen) {
            const buf = fs.readFileSync(chosen);
            if (buf.length > 8 && buf[0] === 0x89 && buf[1] === 0x50 && buf[2] === 0x4e && buf[3] === 0x47) {
              fs.writeFileSync(outIcon, buf);
              console.log("Using app icon:", chosen);
              copied = true;
            }
          }

          if (!copied) {
            const w = 512, h = 512, rowSize = 1 + w * 4;
            const raw = Buffer.alloc(rowSize * h);
            for (let y = 0; y < h; y++) {
              raw[y * rowSize] = 0;
              for (let x = 0; x < w; x++) {
                const idx = y * rowSize + 1 + x * 4;
                raw[idx] = 9; raw[idx + 1] = 9; raw[idx + 2] = 11; raw[idx + 3] = 255;
              }
            }
            const compressed = zlib.deflateSync(raw);
            function chunk(type, data) {
              const len = Buffer.alloc(4); len.writeUInt32BE(data.length, 0);
              const t = Buffer.from(type);
              const crcBuf = Buffer.concat([t, data]);
              let c = 0xffffffff;
              for (let i = 0; i < crcBuf.length; i++) {
                c ^= crcBuf[i];
                for (let k = 0; k < 8; k++) c = (c & 1) ? (0xedb88320 ^ (c >>> 1)) : (c >>> 1);
              }
              const crc = Buffer.alloc(4); crc.writeUInt32BE((c ^ 0xffffffff) >>> 0, 0);
              return Buffer.concat([len, t, data, crc]);
            }
            const ihdr = Buffer.alloc(13);
            ihdr.writeUInt32BE(w, 0); ihdr.writeUInt32BE(h, 4);
            ihdr[8] = 8; ihdr[9] = 6;
            fs.writeFileSync(outIcon, Buffer.concat([
              Buffer.from([137,80,78,71,13,10,26,10]),
              chunk("IHDR", ihdr),
              chunk("IDAT", compressed),
              chunk("IEND", Buffer.alloc(0))
            ]));
          }
          '

          cat << 'EOF' > offline-app/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "DarkPomodoroOffline"
          include ':app'
          EOF

          cat << 'EOF' > offline-app/build.gradle
          plugins {
              id 'com.android.application' version '8.6.0' apply false
          }
          EOF

          cat << 'EOF' > offline-app/gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > offline-app/app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.captanprice.midnightfocus'
              compileSdk 35

              defaultConfig {
                  applicationId "com.captanprice.midnightfocus"
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName "1.0.0"
              }

              signingConfigs {
                  release {
                      storeFile file("../../android.keystore")
                      storePassword "android123"
                      keyAlias "android"
                      keyPassword "android123"
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.webkit:webkit:1.12.1'
          }
          EOF

          cat << 'EOF' > offline-app/app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:Theme.NoTitleBar">
                  <item name="android:windowBackground">#09090B</item>
                  <item name="android:statusBarColor">#09090B</item>
                  <item name="android:navigationBarColor">#09090B</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > offline-app/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="Dark Pomodoro"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true"
                      android:launchMode="singleTask">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > offline-app/app/src/main/java/com/captanprice/midnightfocus/MainActivity.java
          package com.captanprice.midnightfocus;

          import android.app.Activity;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.webkit.WebViewAssetLoader;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  requestWindowFeature(Window.FEATURE_NO_TITLE);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);

                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.parseColor("#09090B"));
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setAllowFileAccess(false);
                  settings.setAllowContentAccess(false);

                  final WebViewAssetLoader assetLoader = new WebViewAssetLoader.Builder()
                          .addPathHandler("/", new WebViewAssetLoader.AssetsPathHandler(this))
                          .build();

                  webView.setWebChromeClient(new WebChromeClient());
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          Uri url = request.getUrl();
                          if ("appassets.androidplatform.net".equals(url.getHost())) {
                              String path = url.getPath();
                              if (path == null || path.isEmpty() || path.equals("/") || !path.contains(".")) {
                                  try {
                                      return new WebResourceResponse(
                                          "text/html",
                                          "UTF-8",
                                          getAssets().open("index.html")
                                      );
                                  } catch (Exception ignored) {}
                              }
                          }
                          return assetLoader.shouldInterceptRequest(url);
                      }
                  });

                  webView.loadUrl("https://appassets.androidplatform.net/");
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Compile Signed Offline APK
        run: |
          cd offline-app
          gradle assembleRelease --no-daemon

      - name: Package Offline APK & Keystore
        run: |
          mkdir -p release-files
          cp offline-app/app/build/outputs/apk/release/app-release.apk release-files/Dark-Pomodoro-Offline.apk
          cp android.keystore release-files/

      - name: Upload Offline APK Package
        uses: actions/upload-artifact@v4
        with:
          name: Dark-Pomodoro-Offline-APK
          path: release-files/
